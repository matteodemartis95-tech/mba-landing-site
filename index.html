<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jahizoun MBA Tracker</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232a78d6'/><text x='32' y='42' font-size='30' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'>J</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <div class="brand-mark">J</div>
        <div class="brand-text"><strong>Jahizoun MBA Tracker</strong><span>EO secondment · MBA applications</span></div>
      </a>
      <nav class="nav" id="nav">
        <a href="#/" data-route="home">Candidates</a>
        <a href="#/deadlines" data-route="deadlines">Deadlines</a>
      </nav>
      <div class="topbar-actions">
        <button class="btn ghost" id="themeBtn" title="Toggle light / dark">◐</button>
        <button class="btn" id="editToggle">Edit mode</button>
      </div>
    </div>
  </header>
  <div class="edit-banner hidden" id="editBanner">
    <div class="topbar-inner">
      <span><b>Edit mode is on.</b> Changes are saved in this browser only. To publish them for everyone, click <b>Copy data.js</b>, then open <code>js/data.js</code> on GitHub, click the pencil, select all, paste and commit.</span>
      <span class="topbar-actions">
        <button class="btn small" id="addBtn">+ Add candidate</button>
        <button class="btn small primary" id="copyBtn">Copy data.js</button>
        <button class="btn small" id="exportBtn">Export data.js</button>
        <button class="btn small danger" id="resetBtn">Discard local changes</button>
      </span>
    </div>
  </div>

  <main class="page" id="app"></main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
